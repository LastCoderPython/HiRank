services:
  # ── API Server ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Gunicorn is the default CMD in Dockerfile
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:9000/api/v1/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ── Celery Worker (Ingestion) ───────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A app.worker:celery_app worker
      --loglevel=info
      --queues=ingestion
      --concurrency=2
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  # ── ChromaDB Server (Vector Database) ───────────────────
  chromadb:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_AUTHN_PROVIDER=chromadb.auth.token_authn.TokenAuthenticationServerProvider
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMA_AUTH_TOKEN}
    # NOT exposed on a host port — internal Docker network only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (Broker + Result Backend + Cache) ─────────────
  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Flower (Celery Monitoring — optional) ───────────────
  # WARNING: Flower has no built-in TLS. Do not expose on public networks.
  # Set FLOWER_PASSWORD to a strong value, or remove this service in production.
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "if [ -z \"$${FLOWER_PASSWORD}\" ]; then echo 'FATAL: FLOWER_PASSWORD must be set' >&2; exit 1; fi;
             celery -A app.worker:celery_app flower --port=5555 --basic_auth=admin:$${FLOWER_PASSWORD}"
    environment:
      - FLOWER_PASSWORD=${FLOWER_PASSWORD:?must be set}
    # Port 5555 is NOT mapped to host — access via docker network only
    depends_on:
      - redis
    restart: unless-stopped

  # ── Caddy (Reverse Proxy + Rate Limiting) ───────────────
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    restart: unless-stopped

  # ── Celery Beat (Scheduled Re-scraping) ─────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.worker:celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:

