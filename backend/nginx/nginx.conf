events {
    worker_connections 1024;
}

http {
    # Rate limiting: 10 requests/sec per IP, burst of 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream rankroute_api {
        server api:9000;
    }

    server {
        listen 80;
        server_name _;

        # Health check bypass (no rate limit)
        location /api/health {
            proxy_pass http://rankroute_api;
        }

        # API routes with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://rankroute_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support (for streaming chat responses)
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Block docs access in production
        location /docs {
            return 403;
        }
        location /redoc {
            return 403;
        }
    }
}
